[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qntyspot"
version = "0.0.1a0"
description = "QntySpot V0A - offline deterministic core for a future policy-bound spot execution runtime"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
dependencies = [
    "cryptography>=41.0",
    # Used only for read-only EVM RLP decoding and secp256k1 sender recovery.
    # It never receives signing material and is not an RPC or wallet client.
    "eth-keys>=0.7,<0.9",
    "rlp>=4,<6",
]

# V0A DEPENDENCY BOUNDARY (enforced by tests/test_no_network.py):
#   no web3, no viem, no solana/solders, no HTTP client, no database server.
#   Standard-library core plus narrow cryptographic dependencies for Ed25519
#   authority receipts and read-only EVM signed-byte validation. SQLite is the
#   persistence substrate.

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["qntyspot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
