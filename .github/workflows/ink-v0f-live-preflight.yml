name: Ink V0F live router preflight

on:
  push:
    branches:
      - agent/v0f-ink-router-envelope-preauth-v0

permissions:
  contents: read

jobs:
  live-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install -e .
      - name: Read-only Ink V0F router qualification
        run: python qualifications/ink_v0f/preauth_live.py
