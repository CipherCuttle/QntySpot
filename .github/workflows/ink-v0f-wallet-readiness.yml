name: ink-v0f-wallet-readiness

on:
  push:
    branches:
      - agent/ink-v0f-wallet-readiness-wrap-v0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wallet-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install QntySpot
        run: python -m pip install -e .

      - name: Read Ink wallet readiness from canonical providers
        shell: python
        run: |
          import json

          from qntyspot.ink import INK_CHAIN_ID, INK_RPC_ENDPOINTS, JsonRpcClient

          wallet = "0x3e604be3293d930069d0805e85379e0ca5fa01cb"
          weth = "0x4200000000000000000000000000000000000006"

          def qty(v):
              if not isinstance(v, str) or not v.startswith("0x"):
                  raise RuntimeError(f"non-canonical quantity: {v!r}")
              return int(v, 16)

          clients = [JsonRpcClient(endpoint, max_retries=2) for endpoint in INK_RPC_ENDPOINTS]
          chain_ids = [qty(client.request("eth_chainId", [])) for client in clients]
          if chain_ids != [INK_CHAIN_ID, INK_CHAIN_ID]:
              raise RuntimeError(f"wrong chain ids: {chain_ids}")

          heads = [qty(client.request("eth_blockNumber", [])) for client in clients]
          if abs(heads[0] - heads[1]) > 8:
              raise RuntimeError(f"provider head lag too large: {heads}")
          common_block = min(heads)
          block_tag = hex(common_block)

          selector = "70a08231"
          owner_word = wallet[2:].lower().rjust(64, "0")
          balance_of = "0x" + selector + owner_word

          rows = []
          for client, head in zip(clients, heads):
              native = qty(client.request("eth_getBalance", [wallet, block_tag]))
              nonce = qty(client.request("eth_getTransactionCount", [wallet, block_tag]))
              weth_balance = qty(client.request("eth_call", [{
                  "to": weth,
                  "data": balance_of,
              }, block_tag]))
              rows.append({
                  "provider": client.endpoint,
                  "head": head,
                  "common_block": common_block,
                  "chain_id": INK_CHAIN_ID,
                  "native_wei": native,
                  "weth_wei": weth_balance,
                  "nonce": nonce,
              })

          for field in ("native_wei", "weth_wei", "nonce"):
              if rows[0][field] != rows[1][field]:
                  raise RuntimeError(f"providers disagree on {field}: {rows}")

          native = rows[0]["native_wei"]
          weth_balance = rows[0]["weth_wei"]
          target = 10**15
          result = {
              "schema": "qntyspot.ink_v0f.wallet_readiness.v0",
              "wallet": wallet,
              "weth": weth,
              "provider_rows": rows,
              "target_wrap_wei": target,
              "native_wei": native,
              "weth_wei": weth_balance,
              "nonce": rows[0]["nonce"],
              "needs_wrap": weth_balance < target,
              "native_covers_exact_wrap": native >= target,
              "native_remaining_after_exact_wrap_wei": native - target if native >= target else None,
          }
          print("INK_V0F_WALLET_READINESS=" + json.dumps(result, sort_keys=True, separators=(",", ":")))
