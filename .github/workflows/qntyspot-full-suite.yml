name: qntyspot-full-suite

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development requirements
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Compile and import sanity
        run: python -m compileall -q qntyspot scripts
      - name: Check whitespace
        run: git diff --check
      - name: Run full offline suite
        run: python -m pytest -q
