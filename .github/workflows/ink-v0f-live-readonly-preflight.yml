name: ink-v0f-live-readonly-preflight

on:
  push:
    branches:
      - agent/ink-v0f-live-readonly-preflight-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical QntySpot branch
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install QntySpot
        run: python -m pip install --disable-pip-version-check -e .
      - name: Assert canonical execution identity
        run: |
          python scripts/derive_deployment_identity.py             --root .             --repository-commit af5edb2eaf9e6ab55a8295da4a9cb5f2e7d549b6             --output /tmp/qntyspot-identity.json
          python - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path("/tmp/qntyspot-identity.json").read_text())
          assert obj["implementation_digest"] == "f0f3dfb14ddc5be1b2b500fdd4bf134f37dc63c56116e8be39a5496b95db707a"
          print(json.dumps({
              "repository_commit":"af5edb2eaf9e6ab55a8295da4a9cb5f2e7d549b6",
              "implementation_digest":obj["implementation_digest"],
          }, sort_keys=True, separators=(",",":")))
          PY
      - name: Run live read-only Ink V0F router and allowance preflight
        run: python qualifications/ink_v0f/preauth_live.py
